version: '3.8'

services:
  # FastAPI REST Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: priceguard-backend
    restart: unless-stopped
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit Policymaker Console Service
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: priceguard-dashboard
    restart: unless-stopped
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - ./data:/app/data
      - ./config:/app/config
